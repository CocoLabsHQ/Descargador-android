name: Compilar y publicar APK

on:
  push:
    branches: [main]
    tags: ["v*"]          # al subir una etiqueta como v0.3 se publica una versión nueva
  workflow_dispatch:

permissions:
  contents: write         # necesario para crear la Release con el APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Versión
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0-dev"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Preparar firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/descargador.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/descargador.jks" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64: sin firma estable las actualizaciones no se pueden instalar."
            exit 1
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ github.run_number }} --no-daemon

      - name: Renombrar APK
        run: mv app/build/outputs/apk/release/*.apk "Descargador-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: descargador-apk
          path: Descargador-*.apk

      - name: Publicar versión en GitHub (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Descargador-*.apk
          generate_release_notes: true
